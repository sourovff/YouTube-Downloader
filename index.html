<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFetch — Premium Media Downloader</title>

    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #090d16;
            --accent-glow: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --glass-bg: rgba(22, 30, 46, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Effects */
        .ambient-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: var(--accent-gradient);
            filter: blur(140px);
            opacity: 0.25;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .glow-1 { top: 10%; left: 15%; }
        .glow-2 { bottom: 10%; right: 15%; }

        /* Main Container */
        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 580px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #818cf8;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 6px;
        }

        /* Glass Card */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        /* Input Form */
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn-fetch {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-fetch:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Loader */
        .loader-box {
            display: none;
            text-align: center;
            padding: 24px 0;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Result Section */
        .result-box {
            display: none;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--glass-border);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(100px); } to { opacity: 1; transform: translateY(0); } }

        .media-preview {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            background: rgba(15, 23, 42, 0.4);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .media-preview img {
            width: 110px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        .media-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .media-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .media-author {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Download Options Grid */
        .download-options {
            display: grid;
            gap: 10px;
        }

        .dl-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .dl-btn:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateX(4px);
        }

        .dl-btn.audio-btn {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .dl-btn.audio-btn:hover {
            background: rgba(16, 185, 129, 0.2);
        }

        .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="wrapper">
        <div class="header">
            <div class="logo-badge">
                <i class="fa-solid fa-bolt"></i> Ultra Fast Direct Downloader
            </div>
            <h1>StreamFetch</h1>
            <p>Paste any YouTube link & extract high-speed download streams</p>
        </div>

        <div class="card">
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-link"></i>
                    <input type="text" id="urlInput" placeholder="Paste YouTube Video URL here...">
                </div>
                <button class="btn-fetch" onclick="fetchVideo()">
                    <span>Fetch</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <!-- Loader -->
            <div class="loader-box" id="loader">
                <div class="spinner"></div>
                <p style="font-size: 14px; color: var(--text-muted);">Extracting direct CDN links...</p>
            </div>

            <!-- Result Box -->
            <div class="result-box" id="resultCard">
                <div class="media-preview">
                    <img id="thumb" src="" alt="Thumbnail">
                    <div class="media-info">
                        <div class="media-title" id="vidTitle">Video Title Goes Here</div>
                        <div class="media-author" id="vidInfo"><i class="fa-regular fa-user"></i> Channel Name</div>
                    </div>
                </div>

                <div class="download-options" id="linksContainer">
                    <!-- Dynamic Buttons will insert here -->
                </div>
            </div>
        </div>

        <div class="footer">
            Powered by Python <code>yt-dlp</code> & Flask Backend
        </div>
    </div>

    <script>
        async function fetchVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('resultCard');
            
            if (!url) {
                alert('Please paste a valid YouTube link!');
                return;
            }

            loader.style.display = 'block';
            resultCard.style.display = 'none';

            try {
                const response = await fetch('/get_links', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('thumb').src = data.thumbnail;
                    document.getElementById('vidTitle').innerText = data.title;
                    document.getElementById('vidInfo').innerHTML = `<i class="fa-regular fa-user"></i> ${data.uploader}`;
                    
                    let linksHtml = '';
                    
                    // Video Resolution Links
                    for (let [res, link] of Object.entries(data.resolutions)) {
                        linksHtml += `
                            <a class="dl-btn" href="${link}" target="_blank" download>
                                <span><i class="fa-solid fa-video" style="margin-right: 8px; color: #818cf8;"></i> Download MP4 (${res}p)</span>
                                <span class="badge">Direct CDN</span>
                            </a>`;
                    }

                    // MP3 Audio Link
                    if (data.audio_url) {
                        linksHtml += `
                            <a class="dl-btn audio-btn" href="${data.audio_url}" target="_blank" download>
                                <span><i class="fa-solid fa-music" style="margin-right: 8px;"></i> Download High-Quality MP3</span>
                                <span class="badge" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">Audio</span>
                            </a>`;
                    }

                    document.getElementById('linksContainer').innerHTML = linksHtml;
                    resultCard.style.display = 'block';
                } else {
                    alert(data.error || 'Failed to extract video details.');
                }
            } catch (err) {
                alert('Connection failed. Make sure your Python backend is running!');
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
